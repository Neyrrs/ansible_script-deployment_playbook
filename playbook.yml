---
- name: Deploy Apex One Agent
  hosts: apex_one_windows
  tasks:
    - name: Check whether Apex One agent is already installed
      ansible.windows.win_service_info:
        name: ntrtscan
      register: apex_service_precheck
      tags:
        - precheck

    - name: Remove ALL existing SMB connections to the server
      ansible.windows.win_command:
        argv:
          - net
          - use
          - "*"
          - "/delete"
          - "/y"
      changed_when: false
      failed_when: false
      tags:
        - connection_debug
        - deploy
      when: apex_service_precheck.services | length == 0

    - name: Kill any lingering AutoPcc.exe processes from previous runs
      ansible.windows.win_shell: |
        Get-Process -Name AutoPcc -ErrorAction SilentlyContinue | Stop-Process -Force
      changed_when: false
      failed_when: false
      tags:
        - deploy
      when: apex_service_precheck.services | length == 0

    - name: Deploy Apex One Agent via AutoPcc
      ansible.windows.win_shell: |
        $ErrorActionPreference = "Stop"

        net use "{{ apex_one_share }}" /user:{{ apex_one_share_user }} "{{ apex_one_share_password }}" /persistent:no
        if ($LASTEXITCODE -ne 0) {
            throw "Gagal membuat koneksi ke share (exit code: $LASTEXITCODE)"
        }

        # try {
        #     if (-not (Test-Path "{{ apex_one_share }}\AutoPcc.exe")) {
        #         throw "AutoPcc.exe tidak ditemukan"
        #     }

        #     Set-Location "{{ apex_one_share }}"

        #     $env:SEE_MASK_NOZONECHECKS = "1"   # <-- ini kuncinya, skip popup "Open File - Security Warning"

        #     $process = Start-Process -FilePath ".\AutoPcc.exe" -PassThru
        #     $process.WaitForExit()

        #     Remove-Item Env:\SEE_MASK_NOZONECHECKS -ErrorAction SilentlyContinue

        #     Write-Output "AutoPcc ExitCode: $($process.ExitCode)"
        #     if ($process.ExitCode -ne 0) {
        #         exit $process.ExitCode
        #     }
        # }
        # finally {
        #     net use "{{ apex_one_share }}" /delete /y
        # }
      register: apex_deploy_result
      tags:
        - install
        - deploy
      when: apex_service_precheck.services | length == 0

    - name: Show deployment result
      ansible.builtin.debug:
        msg:
          rc: "{{ apex_deploy_result.rc }}"
          stdout: "{{ apex_deploy_result.stdout }}"
          stderr: "{{ apex_deploy_result.stderr }}"
      when: apex_service_precheck.services | length == 0
      tags:
        - deploy

    - name: Wait for agent service to register
      ansible.builtin.pause:
        seconds: 20
      tags:
        - install
        - deploy
      when: apex_service_precheck.services | length == 0

    - name: Verify Apex One agent service is running
      ansible.windows.win_service_info:
        name: ntrtscan
      register: apex_service_check
      tags:
        - verify

    - name: Report final status
      ansible.builtin.debug:
        msg: apex_service_check
      tags:
        - verify

    - name: Report final status
      ansible.builtin.debug:
        msg: >-
          {% if apex_service_check.services | length > 0 and apex_service_check.services[0].state == 'running' %}
          Apex One agent berhasil ter-install dan service berjalan.
          {% endif %}
      tags:
        - verify
